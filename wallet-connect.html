<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invisible Yield - Connect Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/get-starknet/dist/index.global.js"></script>
    <script type="module" src="https://unpkg.com/starknet@5.24.3/dist/index.js"></script>
    <script type="module" src="starknet-integration.js"></script>
</head>
<body class="bg-black text-white">
    <div class="min-h-screen bg-gradient-to-b from-black via-green-950 to-black flex items-center justify-center">
        <div class="max-w-md w-full p-8">
            <h1 class="text-4xl font-bold text-center mb-8 bg-gradient-to-r from-green-400 to-emerald-400 bg-clip-text text-transparent">
                Connect Your Wallet
            </h1>
            
            <div class="space-y-4">
                <button id="argent-btn" onclick="connectArgent()" class="w-full p-4 bg-gradient-to-r from-blue-600 to-purple-600 rounded-lg font-semibold hover:scale-105 transition flex items-center justify-center gap-3">
                    <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center">
                        <span class="text-blue-600 font-bold text-sm">A</span>
                    </div>
                    <span>Connect with Argent X</span>
                </button>
                
                <button id="braavos-btn" onclick="connectBraavos()" class="w-full p-4 bg-gradient-to-r from-orange-600 to-red-600 rounded-lg font-semibold hover:scale-105 transition flex items-center justify-center gap-3">
                    <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center">
                        <span class="text-orange-600 font-bold text-sm">B</span>
                    </div>
                    <span>Connect with Braavos</span>
                </button>
                
                <button id="any-wallet-btn" onclick="connectAnyWallet()" class="w-full p-4 bg-gradient-to-r from-green-600 to-emerald-600 rounded-lg font-semibold hover:scale-105 transition flex items-center justify-center gap-3">
                    <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center">
                        <span class="text-green-600 font-bold text-sm">W</span>
                    </div>
                    <span>Connect Any StarkNet Wallet</span>
                </button>
                
                <div class="text-center text-gray-400 text-sm mt-6">
                    <p>Don't have a wallet? Download:</p>
                    <div class="flex justify-center gap-4 mt-2">
                        <a href="https://www.argent.xyz/argent-x/" target="_blank" class="text-blue-400 hover:underline">Argent X</a>
                        <span>•</span>
                        <a href="https://braavos.app/" target="_blank" class="text-orange-400 hover:underline">Braavos</a>
                    </div>
                </div>
            </div>
            
            <div id="walletInfo" class="mt-8 p-6 bg-black/50 rounded-lg hidden border border-emerald-500/30">
                <div class="text-center">
                    <div class="w-16 h-16 bg-gradient-to-r from-green-400 to-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4">
                        <span class="text-2xl">✅</span>
                    </div>
                    <h3 class="text-lg font-bold text-green-400 mb-2">Wallet Connected!</h3>
                    <p class="text-sm text-gray-400 mb-2">Network: <span id="network"></span></p>
                    <p class="text-sm text-gray-400">Address:</p>
                    <p id="address" class="font-mono text-green-400 text-xs bg-black/30 p-2 rounded mt-1"></p>
                    <div class="mt-6 space-y-3">
                        <button onclick="goToDashboard()" class="w-full px-6 py-3 bg-gradient-to-r from-emerald-500 to-green-600 rounded-lg font-semibold hover:scale-105 transition">
                            🚀 Go to Dashboard
                        </button>
                        <button onclick="disconnect()" class="w-full px-6 py-3 bg-black/50 border border-red-500/50 rounded-lg font-semibold hover:bg-red-950/30 transition">
                            Disconnect
                        </button>
                    </div>
                </div>
            </div>
            
            <div id="loading" class="mt-8 p-6 bg-black/50 rounded-lg hidden border border-emerald-500/30 text-center">
                <div class="animate-spin w-8 h-8 border-4 border-emerald-400 border-t-transparent rounded-full mx-auto mb-4"></div>
                <p class="text-emerald-400 font-semibold">Connecting to wallet...</p>
                <p class="text-gray-400 text-sm mt-2">Please approve the connection in your wallet</p>
            </div>
        </div>
    </div>

    <script type="module">
        import InvisibleYieldStarkNet from './starknet-integration.js';
        
        let connectedWallet = null;
        let userAddress = null;
        
        // Connect to Argent X specifically
        window.connectArgent = async function() {
            await connectWallet('argentX');
        };
        
        // Connect to Braavos specifically  
        window.connectBraavos = async function() {
            await connectWallet('braavos');
        };
        
        // Connect to any available wallet
        window.connectAnyWallet = async function() {
            await connectWallet(null);
        };
        
        // Generic wallet connection function
        async function connectWallet(walletId) {
            try {
                showLoading(true);
                hideWalletInfo();
                disableButtons(true);
                
                console.log(`🔌 Attempting to connect ${walletId || 'any wallet'}...`);
                
                const result = await window.InvisibleYield.connectWallet(walletId);
                
                if (result.success) {
                    connectedWallet = result.walletName;
                    userAddress = result.address;
                    
                    console.log('✅ Wallet connected successfully!');
                    console.log('📍 Address:', result.address);
                    console.log('🌐 Network:', result.chainId);
                    
                    showWalletInfo(result);
                    showNotification(`Successfully connected to ${result.walletName}!`, 'success');
                    
                    // Auto-redirect to dashboard after 3 seconds
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 3000);
                    
                } else {
                    throw new Error('Connection failed');
                }
                
            } catch (error) {
                console.error('❌ Wallet connection failed:', error);
                
                let message = 'Failed to connect wallet. ';
                if (error.message.includes('User rejected') || error.message.includes('User denied')) {
                    message += 'Connection was rejected.';
                } else if (walletId === 'argentX') {
                    message += 'Please install Argent X extension.';
                } else if (walletId === 'braavos') {
                    message += 'Please install Braavos extension.';
                } else {
                    message += 'Please install a StarkNet wallet (Argent X or Braavos).';
                }
                
                showNotification(message, 'error');
                
            } finally {
                showLoading(false);
                disableButtons(false);
            }
        }
        
        // Show/hide loading state
        function showLoading(show) {
            const loading = document.getElementById('loading');
            if (show) {
                loading.classList.remove('hidden');
            } else {
                loading.classList.add('hidden');
            }
        }
        
        // Show wallet connection info
        function showWalletInfo(result) {
            showLoading(false);
            
            const walletInfo = document.getElementById('walletInfo');
            const address = document.getElementById('address');
            const network = document.getElementById('network');
            
            address.textContent = result.address;
            network.textContent = result.isTestnet ? 'Sepolia Testnet' : 'StarkNet Mainnet';
            
            walletInfo.classList.remove('hidden');
        }
        
        // Hide wallet info
        function hideWalletInfo() {
            const walletInfo = document.getElementById('walletInfo');
            walletInfo.classList.add('hidden');
        }
        
        // Enable/disable connection buttons
        function disableButtons(disabled) {
            const buttons = ['argent-btn', 'braavos-btn', 'any-wallet-btn'];
            buttons.forEach(id => {
                const btn = document.getElementById(id);
                btn.disabled = disabled;
                if (disabled) {
                    btn.classList.add('opacity-50', 'cursor-not-allowed');
                } else {
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            });
        }
        
        // Go to dashboard
        window.goToDashboard = function() {
            window.location.href = 'dashboard.html';
        };
        
        // Disconnect wallet
        window.disconnect = async function() {
            try {
                await window.InvisibleYield.disconnectWallet();
                hideWalletInfo();
                connectedWallet = null;
                userAddress = null;
                showNotification('Wallet disconnected', 'info');
            } catch (error) {
                console.error('Disconnect error:', error);
            }
        };
        
        // Show notification helper
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 p-4 rounded-lg z-50 max-w-sm ${
                type === 'success' ? 'bg-green-600' :
                type === 'error' ? 'bg-red-600' :
                type === 'warning' ? 'bg-yellow-600' :
                'bg-blue-600'
            } text-white shadow-lg`;
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            // Auto remove after 5 seconds
            setTimeout(() => {
                notification.remove();
            }, 5000);
        }
        
        // Check for existing connection on page load
        window.addEventListener('DOMContentLoaded', async () => {
            console.log('🔍 Checking for existing wallet connection...');
            
            try {
                // Check if get-starknet is available and has existing connection
                const starknet = globalThis.starknet;
                if (starknet && starknet.isConnected) {
                    console.log('Found existing wallet connection, attempting to restore...');
                    showLoading(true);
                    
                    const result = await window.InvisibleYield.connectWallet();
                    if (result.success) {
                        showWalletInfo(result);
                        connectedWallet = result.walletName;
                        userAddress = result.address;
                        showNotification(`Reconnected to ${result.walletName}!`, 'success');
                    }
                }
            } catch (error) {
                console.log('No existing wallet connection found');
            } finally {
                showLoading(false);
            }
        });
    </script>
</body>
</html>
